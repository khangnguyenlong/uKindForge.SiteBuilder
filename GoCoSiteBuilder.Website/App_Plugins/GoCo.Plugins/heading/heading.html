<div ng-controller="GoCo.HeadingController">
    <div class="heading-control">
        <div class="heading-control__toolbar">
            <div class="toolbar__select">
                <select ng-model="model.value.headingTag">
                    <option ng-repeat="tag in headingTags" value="{{tag}}">{{tag | uppercase}}</option>
                </select>
            </div>
            <div class="toolbar__control toolbar__align" ng-hide="model.config.hideAlignControl === '1'">
                <button aria-label="Align left" title="Align left" type="button" tabindex="-1"
                        class="tox-tbtn" aria-disabled="false" aria-pressed="true"
                        ng-class="{'tox-tbtn--enabled': model.value.align === 'left'}"
                        style="width: 34px;"
                        ng-click="model.value.align = model.value.align === 'left' ? '' : 'left'"
                        >
                    <span class="tox-icon tox-tbtn__icon-wrap">
                        <svg width="24" height="24"
                             focusable="false">
                            <path d="M5 5h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm0 4h8c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm0 8h8c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Zm0-4h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Z"
                                  fill-rule="evenodd"></path>
                        </svg>
                    </span>
                </button>
                <button aria-label="Align center" title="Align center"
                        type="button" tabindex="-1" class="tox-tbtn" aria-disabled="false" aria-pressed="false"
                        style="width: 34px;"
                        ng-class="{'tox-tbtn--enabled': model.value.align === 'center'}"
                        ng-click="model.value.align = model.value.align === 'center' ? '' : 'center'"
                        >
                    <span class="tox-icon tox-tbtn__icon-wrap">
                        <svg width="24" height="24"
                             focusable="false">
                            <path d="M5 5h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm3 4h8c.6 0 1 .4 1 1s-.4 1-1 1H8a1 1 0 1 1 0-2Zm0 8h8c.6 0 1 .4 1 1s-.4 1-1 1H8a1 1 0 0 1 0-2Zm-3-4h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Z"
                                  fill-rule="evenodd"></path>
                        </svg>
                    </span>
                </button>
                <button aria-label="Align right" title="Align right" type="button"
                        tabindex="-1" class="tox-tbtn" aria-disabled="false" aria-pressed="false"
                        style="width: 34px;"
                        ng-class="{'tox-tbtn--enabled': model.value.align === 'right'}"
                        ng-click="model.value.align = model.value.align === 'right' ? '' : 'right'"
                        >
                    <span class="tox-icon tox-tbtn__icon-wrap">
                        <svg width="24" height="24"
                             focusable="false">
                            <path d="M5 5h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm6 4h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2Zm0 8h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2Zm-6-4h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Z"
                                  fill-rule="evenodd"></path>
                        </svg>
                    </span>
                </button>
            </div>
            <div class="toolbar__control toolbar__link" ng-hide="model.config.hideUrlPickerControl === '1'">
                <button aria-label="Insert/edit link" title="Insert/edit link" type="button" tabindex="-1" class="tox-tbtn" aria-disabled="false" aria-pressed="false" style="width: 34px;"
                        ng-class="{'tox-tbtn--enabled': model.value.link && model.value.link.url}"
                        ng-click="openLinkPicker()">
                    <span class="tox-icon tox-tbtn__icon-wrap">
                        <svg width="24" height="24" focusable="false"><path d="M6.2 12.3a1 1 0 0 1 1.4 1.4l-2 2a2 2 0 1 0 2.6 2.8l4.8-4.8a1 1 0 0 0 0-1.4 1 1 0 1 1 1.4-1.3 2.9 2.9 0 0 1 0 4L9.6 20a3.9 3.9 0 0 1-5.5-5.5l2-2Zm11.6-.6a1 1 0 0 1-1.4-1.4l2-2a2 2 0 1 0-2.6-2.8L11 10.3a1 1 0 0 0 0 1.4A1 1 0 1 1 9.6 13a2.9 2.9 0 0 1 0-4L14.4 4a3.9 3.9 0 0 1 5.5 5.5l-2 2Z" fill-rule="nonzero"></path></svg>
                    </span>
                </button>
                <button aria-label="Remove link" title="Remove link" type="button" tabindex="-1" class="tox-tbtn" aria-disabled="false" aria-pressed="false" style="width: 34px;"
                        ng-click="removeLinkPicker()">
                    <span class="tox-icon tox-tbtn__icon-wrap">
                        <svg width="24" height="24" focusable="false"><path d="M6.2 12.3a1 1 0 0 1 1.4 1.4l-2 2a2 2 0 1 0 2.6 2.8l4.8-4.8a1 1 0 0 0 0-1.4 1 1 0 1 1 1.4-1.3 2.9 2.9 0 0 1 0 4L9.6 20a3.9 3.9 0 0 1-5.5-5.5l2-2Zm11.6-.6a1 1 0 0 1-1.4-1.4l2.1-2a2 2 0 1 0-2.7-2.8L11 10.3a1 1 0 0 0 0 1.4A1 1 0 1 1 9.6 13a2.9 2.9 0 0 1 0-4L14.4 4a3.9 3.9 0 0 1 5.5 5.5l-2 2ZM7.6 6.3a.8.8 0 0 1-1 1.1L3.3 4.2a.7.7 0 1 1 1-1l3.2 3.1ZM5.1 8.6a.8.8 0 0 1 0 1.5H3a.8.8 0 0 1 0-1.5H5Zm5-3.5a.8.8 0 0 1-1.5 0V3a.8.8 0 0 1 1.5 0V5Zm6 11.8a.8.8 0 0 1 1-1l3.2 3.2a.8.8 0 0 1-1 1L16 17Zm-2.2 2a.8.8 0 0 1 1.5 0V21a.8.8 0 0 1-1.5 0V19Zm5-3.5a.7.7 0 1 1 0-1.5H21a.8.8 0 0 1 0 1.5H19Z" fill-rule="nonzero"></path></svg>
                    </span>
                </button>
            </div>
        </div>
        <div class="heading-control__input">
            <input type="text" ng-model="model.value.headingText" ng-trim="false" class="umb-property-editor umb-textstring"
                ng-class="'text-' + model.value.align" 
            />
        </div>
    </div>
</div>
