<div ng-controller="GoCo.ColorSettingsController">
    <style>
        .product-card-preview {
            width: 250px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid;
            transition: all 0.3s ease;
        }

            .product-card-preview img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 6px;
                margin-bottom: 12px;
            }

            .product-card-preview .title {
                font-size: 1.2rem;
                font-weight: 600;
                margin-bottom: 6px;
            }

            .product-card-preview .desc {
                font-size: 0.875rem;
                line-height: 1.4;
            }
    </style>

    <div class="product-card-preview"
         ng-style="{
             'background-color': '#' + (model.value.productCard.background || 'fff'),
             'border-color': '#' + (model.value.productCard.border || 'ddd')
         }">

        <img src="/App_Plugins/GoCoPlugins/design/layoutSettings/preview/img/image.png" alt="Product Image" />

        <div class="title"
             ng-style="{ 'color': '#' + (model.value.productCard.title || '000') }">
            Axial Fan Pro X
        </div>

        <div class="desc"
             ng-style="{ 'color': '#' + (model.value.productCard.description || '555') }">
            Size: 250mm - 710mm<br />
            Airflow: up to 22.000 CMH<br />
            Static Pressure: up to 240Pa
        </div>
    </div>
</div>
