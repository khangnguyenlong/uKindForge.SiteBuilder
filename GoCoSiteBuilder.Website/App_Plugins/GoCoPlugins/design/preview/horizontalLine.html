<style>
    .horizontal-line {
        width: 500px;
    }
</style>

<div ng-controller="GoCo.ColorSettingsController">
    <div class="horizontal-line"
         style="{{model.value.horizontalLine.customCSS || ''}}"
         ng-style="{
            'border-top': '#' + (model.value.horizontalLine.lineColor || '000'),
            'border-top-width': (model.value.horizontalLine.lineWidth || '1') + 'px',
            'border-top-style': (model.value.horizontalLine.lineStyle || 'solid')
        }">

    </div>
</div>
