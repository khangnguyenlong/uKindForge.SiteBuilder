<div ng-controller="uKindForge.RadioButtonPlusPrevalueController" style="width:100%;overflow-x:auto;white-space:nowrap;">
    <table class="table table-striped table-responsive table-hover prevaluesTable">
        <thead>
            <tr>
                <th></th>
                <th>SVG Icon</th>
                <th>Properties - Show(+)/Hide(-)</th>
                <th>Option Display Text</th>
                <th>Option Key</th>
                <th>Selected Default</th>
                <th></th>
            </tr>
        </thead>
        <tbody ui-sortable="sortableOptions" ng-model="model.value.items">
            <tr ng-repeat="item in model.value.items">
                <td ng-bind-html="item.svgTrusted"></td>
                <td><textarea rows="3" ng-model="item.svg"></textarea></td>
                <td><textarea rows="3" ng-model="item.properties"></textarea></td>
                <td><input type="text" ng-model="item.text" /></td>
                <td><input type="text" ng-model="item.key" /></td>
                <td><input type="radio" ng-model="model.value.selectedDefault" value="{{item.key}}" ng-click="toggleSelectedDefault($event)" /></td>
                <td class="actions">
                    <span class="btn btn-default icon icon-navigation sortHandle" style="font-size: 18px;" title="sort"></span>
                    <span ng-click="removeItem($index)" class="btn btn-danger icon icon-trash" title="remove"></span>
                </td>
            </tr>
        </tbody>
    </table>

    <button type="button" class="btn btn-default add-item" ng-click="addItem()">Add option</button>

</div>
