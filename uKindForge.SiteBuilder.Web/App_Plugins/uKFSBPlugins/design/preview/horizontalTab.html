<div ng-controller="uKindForge.ColorSettingsController">

    <style>
        .horizontal-tab-preview {
            display: flex;
            flex-direction: column;
            border: 1px solid;
            border-radius: 8px;
            overflow: hidden;
            width: 500px;
            height: 250px;
            transition: all 0.3s ease;
        }

            .horizontal-tab-preview .tab-list {
                display: flex;
                border-bottom: 1px solid;
                background-color: inherit;
                font-size: 16px;
                font-weight: 600;
            }

            .horizontal-tab-preview .tab-item {
                padding: 12px 20px;
                cursor: pointer;
                border-bottom: 4px solid transparent;
                transition: all 0.3s;
                color: inherit;
                background-color: transparent;
                font-size: 15px;
            }

                .horizontal-tab-preview .tab-item.active {
                    font-weight: bold;
                }

            .horizontal-tab-preview .tab-content {
                flex: 1;
                padding: 20px;
                background-color: inherit;
                overflow-y: auto;
                font-size: 16px;
            }
    </style>

    <div class="horizontal-tab-preview"
         ng-style="{
             'border-color': '#' + (model.value.horizontalTab.borderColor || 'dddddd')
         }">

        <div class="tab-list"
             ng-style="{
                 'border-bottom-color': '#' + (model.value.horizontalTab.borderColor || 'dddddd'),
                 'background-color': '#' + (model.value.horizontalTab.bgColor || 'ffffff')
             }">

            <div ng-repeat="tab in tabs"
                 class="tab-item"
                 ng-class="{'active': activeTab === $index}"
                 ng-click="setActiveTab($index)"
                 ng-style="{
                     'color': activeTab === $index ? '#' + (model.value.horizontalTab.activeTitleColor || '000000') : '#' + (model.value.horizontalTab.titleColor || '666666'),
                     'background-color': activeTab === $index ? '#' + (model.value.horizontalTab.activeBgColor || 'eeeeee') : 'transparent',
                     'border-bottom-color': activeTab === $index ? '#' + (model.value.horizontalTab.activeIndicatorColor || '0000ff') : 'transparent'
                 }">
                {{tab.title}}
            </div>

        </div>

        <div class="tab-content">
            {{tabs[activeTab].content}}
        </div>

    </div>

</div>
