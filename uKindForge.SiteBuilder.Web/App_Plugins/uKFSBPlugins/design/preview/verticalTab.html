<div ng-controller="uKindForge.ColorSettingsController">

    <style>
        .vertical-tab-preview {
            display: flex;
            border: 1px solid;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            height: 250px;
            transition: all 0.3s ease;
        }

            .vertical-tab-preview .tab-list {
                display: flex;
                flex-direction: column;
                width: 200px;
                background-color: inherit;
                border-right: 1px solid;
                font-size: 16px;
                font-weight: 600;
            }

            .vertical-tab-preview .tab-item {
                padding: 10px;
                cursor: pointer;
                border-left: 4px solid transparent;
                transition: all 0.3s;
                color: inherit;
                background-color: transparent;
                font-size: 15px;
            }

                .vertical-tab-preview .tab-item.active {
                    font-weight: bold;
                    background-color: inherit;
                    border-left-width: 4px;
                }

            .vertical-tab-preview .tab-content {
                flex: 1;
                padding: 20px;
                background-color: inherit;
                width: 400px;
                font-size: 16px;
            }
    </style>

    <div class="vertical-tab-preview"
         ng-style="{
            'border-color': '#' + (model.value.verticalTab.borderColor || 'dddddd')
         }"
         >

        <div class="tab-list"
             ng-style="{
                 'background-color': '#' + (model.value.verticalTab.bgColor || 'ffffff'),
                 'border-right-color': '#' + (model.value.verticalTab.borderColor || 'dddddd')
             }">

            <div ng-repeat="tab in tabs"
                 class="tab-item"
                 ng-class="{'active': activeTab === $index}"
                 ng-click="setActiveTab($index)"
                 ng-style="{
                     'color': activeTab === $index ? '#' + (model.value.verticalTab.activeTitleColor || '000000') : '#' + (model.value.verticalTab.titleColor || '666666'),
                     'background-color': activeTab === $index ? '#' + (model.value.verticalTab.activeBgColor || 'eeeeee') : 'transparent',
                     'border-left-color': activeTab === $index ? '#' + (model.value.verticalTab.activeIndicatorColor || '0000ff') : '#' + (model.value.verticalTab.indicatorColor || 'cccccc')
                 }">
                {{tab.title}}
            </div>

        </div>

        <div class="tab-content">
            {{tabs[activeTab].content}}
        </div>

    </div>

</div>
